[package]
name = "bookview-collector"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rust_decimal = { version = "1.37", features = ["serde-with-str"] }
ahash = "0.8"
dashmap = "6"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
mimalloc = "0.1"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic"] }
ndarray = "0.16"

[[bin]]
name = "bookview-collector"
path = "src/main.rs"

[[bin]]
name = "backtest"
path = "src/bin/backtest.rs"

[[bin]]
name = "sim"
path = "src/bin/sim.rs"

[dependencies.rayon]
version = "1.10"

[dependencies.clap]
version = "4"
features = ["derive"]

[features]
default = []
executor = [
    "polymarket_client_sdk_v2",
    "alloy",
    "rust_decimal_macros",
    "chrono",
    "hmac",
    "sha2",
    "base64",
    "dotenvy",
    "rustls",
]

[dependencies.polymarket_client_sdk_v2]
version = "=0.6.0-canary.1"
features = ["clob", "ctf", "gamma", "bridge", "tracing", "heartbeats"]
optional = true

[dependencies.alloy]
version = "1.6.3"
features = ["signers", "signer-local", "contract", "sol-types", "providers"]
optional = true

[dependencies.rust_decimal_macros]
version = "1"
optional = true

[dependencies.chrono]
version = "0.4"
features = ["serde"]
optional = true

[dependencies.hmac]
version = "0.12"
optional = true

[dependencies.sha2]
version = "0.10"
optional = true

[dependencies.base64]
version = "0.22"
optional = true

[dependencies.dotenvy]
version = "0.15"
optional = true

[dependencies.rustls]
version = "0.23"
features = ["ring"]
optional = true

[[bin]]
name = "executor-cli"
path = "src/bin/executor.rs"
required-features = ["executor"]

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
